# Builds the release APKs on every `v*` tag and attaches them, unsigned,
# to a draft GitHub Release. The signature is added on the release
# machine by scripts/sign-release.ps1, which swaps the signed files into
# the draft and adds the signed SHA256SUMS; then publish.
# Manual runs build the same APKs and upload them as workflow artifacts only.
#
# The APKs come out of the pinned container of `reproducible/`, so anyone
# can rebuild the same commit and check that the payload matches, byte
# for byte; see docs/REPRODUCIBLE-BUILDS.md. The signing key never comes
# near CI: a runner executes code this repository does not control, and
# an Android signing key cannot be rotated once an app is installed under
# it. Nothing here touches Bitcoin keys; Gerfaut is watch-only by design.
#
#   git tag v0.1.0 && git push origin v0.1.0

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      # No credentials left in .git/config: nothing after a checkout talks
      # to GitHub.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: gerfaut-mobile
          persist-credentials: false

      # The Rust crate depends on the sibling gerfaut-core checkout, at the
      # revision this release pins.
      - name: Read the pinned gerfaut-core revision
        id: core
        run: echo "rev=$(cat gerfaut-mobile/reproducible/gerfaut-core.rev)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: gerfaut-wallet/gerfaut-core
          ref: ${{ steps.core.outputs.rev }}
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          path: gerfaut-core
          persist-credentials: false

      # The pinned image is 13 GB and the build writes several more. What
      # goes is everything the container carries its own copy of, the
      # runner's Android SDK included: nothing on the host signs anymore.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/node_modules
          df -h /

      - name: Build the unsigned APKs
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gerfaut-mobile/reproducible/verify.sh --out "$PWD/unsigned" --version "$GITHUB_REF_NAME"
          else
            gerfaut-mobile/reproducible/verify.sh --out "$PWD/unsigned"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gerfaut-android-unsigned
          if-no-files-found: error
          path: |
            unsigned/*-unsigned.apk
            unsigned/SHA256SUMS

  # The only job that can write to the repository. It runs `gh` on what
  # the build handed over, plus a checkout narrowed to the release notes.
  draft:
    if: startsWith(github.ref, 'refs/tags/')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github/release-notes.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gerfaut-android-unsigned
          path: unsigned

      # The draft carries the files under their `-unsigned` names until
      # the signing script replaces them: a file nobody has signed must
      # not look like one somebody has. `--verify-tag` refuses to invent a
      # tag. A draft that already exists (a re-run) gets its assets
      # replaced; a published release is never touched, `gh release
      # create` fails on it.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -l unsigned
          if [ "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber unsigned/*-unsigned.apk
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag \
              --title "Gerfaut $GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md \
              unsigned/*-unsigned.apk
          fi
