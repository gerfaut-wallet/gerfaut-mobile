name: TestFlight

# Builds the iOS app from main, signs it for the App Store and sends it
# to TestFlight. Started by hand only (Actions, TestFlight, Run
# workflow): nothing reaches Apple unless the maintainer asks.
#
# Until the signing material is in place, the first job says what is
# missing and the upload job is skipped: the workflow is inert.
#
# The secrets live in the `testflight` environment, which only main may
# use, so no pull request ever reads them:
#
#   IOS_DIST_CERT_P12      the Apple Distribution certificate and its
#                          key, as a .p12, in base64
#   IOS_DIST_CERT_PASSWORD the password of that .p12
#   IOS_PROFILE            the App Store provisioning profile of
#                          com.gerfautwallet.gerfaut, in base64
#   APPLE_TEAM_ID          the ten characters of the team
#   ASC_APP_ID             the app's Apple ID in App Store Connect,
#                          digits only
#   ASC_KEY_ID             the App Store Connect API key (App Manager)
#   ASC_ISSUER_ID          its issuer
#   ASC_KEY_P8             the .p8 file of that key, as it was downloaded
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  BUNDLE_ID: com.gerfautwallet.gerfaut

jobs:
  ready:
    runs-on: ubuntu-latest
    environment: testflight
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check the signing material
        id: check
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          REF: ${{ github.ref }}
        run: |
          missing=()
          for name in IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD IOS_PROFILE \
            APPLE_TEAM_ID ASC_APP_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::TestFlight builds come from main only, not $REF"
            exit 1
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::notice::Not sent: missing secrets in the testflight environment: ${missing[*]}"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  upload:
    needs: ready
    if: needs.ready.outputs.ready == 'true'
    runs-on: macos-26
    environment: testflight
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gerfaut-mobile
          persist-credentials: false

      - name: Read the pinned gerfaut-core revision
        id: core
        run: echo "rev=$(cat gerfaut-mobile/reproducible/gerfaut-core.rev)" >> "$GITHUB_OUTPUT"

      - name: Check the pinned revision is on gerfaut-core's main
        env:
          GH_TOKEN: ${{ github.token }}
          REV: ${{ steps.core.outputs.rev }}
        run: gerfaut-mobile/.github/core-on-main.sh "$REV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: gerfaut-wallet/gerfaut-core
          ref: ${{ steps.core.outputs.rev }}
          path: gerfaut-core
          persist-credentials: false

      # The same Xcode, Rust and Flutter as the ios job of CI.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Pin the Rust toolchain
        run: gerfaut-mobile/.github/ios-toolchain.sh gerfaut-mobile
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - run: flutter pub get
        working-directory: gerfaut-mobile

      # A keychain of the job's own, unlocked for codesign alone, and
      # deleted at the end with the profile and the API key.
      - name: Install the certificate and the profile
        id: signing
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          echo "::add-mask::$keychain_password"
          printf '%s' "$IOS_DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/dist.p12" -k "$keychain" \
            -P "$IOS_DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" > /dev/null
          # Searched first, beside the runner's own keychains.
          existing=()
          while IFS= read -r line; do existing+=("$(echo "$line" | tr -d ' "')"); done \
            < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          rm -f "$RUNNER_TEMP/dist.p12"

          printf '%s' "$IOS_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          case "$app_id" in
            *."$BUNDLE_ID") ;;
            *) echo "::error::the profile is for $app_id, not $BUNDLE_ID"; exit 1 ;;
          esac
          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$profiles/$uuid.mobileprovision"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "profile=$name" >> "$GITHUB_OUTPUT"

      - name: Sign Runner by hand for this build
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE: ${{ steps.signing.outputs.profile }}
        run: ruby gerfaut-mobile/.github/ios-signing.rb gerfaut-mobile/ios/Runner.xcodeproj "$APPLE_TEAM_ID" "$PROFILE"

      # The version is pubspec.yaml's; the build number this workflow's
      # run number, which only goes up, as App Store Connect demands.
      - name: Build the signed archive
        id: ipa
        working-directory: gerfaut-mobile
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE: ${{ steps.signing.outputs.profile }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          version=$(sed -n 's/^version: \([0-9.]*\).*/\1/p' pubspec.yaml)
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict><key>$BUNDLE_ID</key><string>$PROFILE</string></dict>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          flutter build ipa --release \
            --build-name "$version" --build-number "$BUILD_NUMBER" \
            --export-options-plist "$RUNNER_TEMP/ExportOptions.plist"
          ipa=$(ls build/ios/ipa/*.ipa)
          echo "ipa=$PWD/$ipa" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # altool's exit code is not to be trusted under Xcode 26: its output
      # is read as well.
      - name: Send to TestFlight
        env:
          ASC_APP_ID: ${{ secrets.ASC_APP_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IPA: ${{ steps.ipa.outputs.ipa }}
          VERSION: ${{ steps.ipa.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          keys="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$keys"
          printf '%s\n' "$ASC_KEY_P8" > "$keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-package "$IPA" --type ios \
            --apple-id "$ASC_APP_ID" --bundle-id "$BUNDLE_ID" \
            --bundle-short-version-string "$VERSION" --bundle-version "$BUILD_NUMBER" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"
          if ! grep -Eq 'UPLOAD SUCCEEDED|No errors uploading' "$RUNNER_TEMP/altool.log"; then
            echo "::error::altool did not report a successful upload"
            exit 1
          fi

      - name: Remove the signing material
        if: always()
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: |
          [ -z "$KEYCHAIN" ] || security delete-keychain "$KEYCHAIN" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" \
            "$HOME/Library/MobileDevice/Provisioning Profiles" \
            "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
