name: CI

# Flutter formatting, analysis and widget tests, the Rust crate's
# formatting, Clippy pass and tests, and the checks of the signing
# script, on every push to main and every pull request. Both the crate
# and the widget tests need the sibling gerfaut-core checkout, at the
# revision reproducible/gerfaut-core.rev pins: the crate builds against
# it, the tests read its reference JSON (test/core_fixtures.dart). It
# is public: no key reads it. The APKs themselves are built by the
# release workflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      # No credentials left in .git/config: nothing after a checkout talks
      # to GitHub, and the steps below run third-party code.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: gerfaut-mobile
          persist-credentials: false

      - name: Read the pinned gerfaut-core revision
        id: core
        run: echo "rev=$(cat gerfaut-mobile/reproducible/gerfaut-core.rev)" >> "$GITHUB_OUTPUT"

      # Only its reference JSON is read here: nothing of it runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: gerfaut-wallet/gerfaut-core
          ref: ${{ steps.core.outputs.rev }}
          path: gerfaut-core
          persist-credentials: false

      # The Flutter the release builds with (reproducible/Dockerfile): a
      # green run on another one says little about the APK.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true
      - run: flutter pub get
        working-directory: gerfaut-mobile
      - name: Format
        working-directory: gerfaut-mobile
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: gerfaut-mobile
        run: flutter analyze
      - name: Test
        working-directory: gerfaut-mobile
        run: flutter test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: gerfaut-mobile
          persist-credentials: false

      # The same revision the release builds against, so a green run here
      # means the APK compiles.
      - name: Read the pinned gerfaut-core revision
        id: core
        run: echo "rev=$(cat gerfaut-mobile/reproducible/gerfaut-core.rev)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: gerfaut-wallet/gerfaut-core
          ref: ${{ steps.core.outputs.rev }}
          path: gerfaut-core
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: gerfaut-mobile/rust

      - name: Format
        working-directory: gerfaut-mobile/rust
        run: cargo fmt --check

      - name: Clippy
        working-directory: gerfaut-mobile/rust
        run: |
          rustup show
          cargo clippy --all-targets -- -D warnings

      # The bridge's own tests: the release build logs nothing, an
      # oversized QR frame is turned away, the isolates share one
      # manager and one first-launch key.
      - name: Test
        working-directory: gerfaut-mobile/rust
        run: cargo test

  # What scripts/sign-release.ps1 checks before it signs a release, on
  # throwaway git repositories: no key, no network. Pester comes with
  # the runner image.
  signing-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Test
        shell: pwsh
        run: |
          Import-Module Pester -MinimumVersion 5.5
          Invoke-Pester -Path scripts -CI
