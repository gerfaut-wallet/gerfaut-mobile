[package]
name = "rust_lib_gerfaut"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
# The built-in Tor client: a phone rarely runs a Tor daemon, and Orbot
# is a second app to install.
gerfaut-core = { path = "../../gerfaut-core", features = ["embedded-tor"] }
# To say how much of what the crates log reaches logcat: nothing in a
# release build. The version flutter_rust_bridge already pulls in, so
# nothing new is compiled.
log = "0.4"
# To draw the vault key of a first launch from the system's randomness;
# the version the core already pulls in, so nothing new is compiled.
rand = "0.9"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Cargo only honours [patch] in the root manifest: the same pin as in
# gerfaut-core, see the note there.
[patch.crates-io]
saturating-time = { git = "https://github.com/gerfaut-wallet/saturating-time", rev = "185ef6a4a1647adac291bd43bb9fd2821e73b9bc" }

[dev-dependencies]
# To run the bridge's async functions in a test.
tokio = { version = "1", features = ["macros", "rt"] }
