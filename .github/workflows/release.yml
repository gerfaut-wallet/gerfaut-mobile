# Builds the release APKs on every `v*` tag and attaches them to a draft
# GitHub Release (review, add the signed SHA256SUMS with
# scripts/sign-release.ps1, then publish).
# Manual runs build the same APKs and upload them as workflow artifacts only.
#
# The APKs are built unsigned inside the pinned container of
# `reproducible/`, then signed here with the app's own release keystore,
# stored in this repository's Actions secrets. Anyone can rebuild the same
# container and check that the payload matches, byte for byte; see
# docs/REPRODUCIBLE-BUILDS.md. Nothing here touches Bitcoin keys; Gerfaut
# is watch-only by design.
#
#   git tag v0.1.0 && git push origin v0.1.0

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gerfaut-mobile

      # The Rust crate depends on the sibling gerfaut-core checkout, at the
      # revision this release pins.
      - name: Read the pinned gerfaut-core revision
        id: core
        run: echo "rev=$(cat gerfaut-mobile/reproducible/gerfaut-core.rev)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: gerfaut-wallet/gerfaut-core
          ref: ${{ steps.core.outputs.rev }}
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          path: gerfaut-core

      # The pinned image is 13 GB and the build writes several more. What
      # goes is everything the container carries its own copy of; the
      # runner's Android SDK stays, because apksigner below comes from it.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          df -h /

      - name: Build the unsigned APKs
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gerfaut-mobile/reproducible/verify.sh --out "$PWD/unsigned" --version "$GITHUB_REF_NAME"
          else
            gerfaut-mobile/reproducible/verify.sh --out "$PWD/unsigned"
          fi

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # With v1 off, apksigner adds no zip entry at all: it only inserts
      # an APK signing block, so every entry stays exactly where the
      # container put it and the published APK can be compared with a
      # rebuild. v1 is only needed below API 24, and minSdk here is 24.
      - name: Sign
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          sdk="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          apksigner="$(ls -d "$sdk"/build-tools/*/apksigner | sort -V | tail -1)"
          mkdir -p signed
          for apk in unsigned/*-unsigned.apk; do
            base="${apk##*/}"
            name="${base%-unsigned.apk}.apk"
            "$apksigner" sign \
              --ks "$RUNNER_TEMP/release.keystore" \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass env:KEYSTORE_PASSWORD \
              --v1-signing-enabled false \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "signed/$name" "$apk"
            "$apksigner" verify --print-certs "signed/$name"
          done
          rm -f "$RUNNER_TEMP/release.keystore"
          ls -l signed

      # Not a reproducibility check — the two files here come from the
      # same build. What it asserts is that signing left the payload
      # alone, entry for entry, which is what lets a verifier compare a
      # published APK with their own unsigned rebuild at all. The
      # reproducibility itself is proven by the `Reproducible build`
      # workflow, which builds the same commit twice.
      - name: Check that signing changed nothing but the signature
        run: |
          for apk in signed/*.apk; do
            name="$(basename "$apk" .apk)"
            python3 gerfaut-mobile/reproducible/compare.py --signed "$apk" "unsigned/$name-unsigned.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: gerfaut-android-apk
          path: signed/*.apk

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --repo "$GITHUB_REPOSITORY" \
            --title "Gerfaut $GITHUB_REF_NAME" \
            --notes-file gerfaut-mobile/.github/release-notes.md \
            signed/*.apk
