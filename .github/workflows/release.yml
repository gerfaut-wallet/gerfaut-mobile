# Builds a signed release APK on every `v*` tag and attaches it to a draft
# GitHub Release (review, sign with scripts/sign-release.ps1, then publish).
# Manual runs build the same APK and upload it as a workflow artifact only.
#
# Standard Android CI signing: the app's own release keystore is stored in
# this repository's Actions secrets and restored to a runner-local file for
# the Gradle signing config. Nothing here touches Bitcoin keys; Gerfaut is
# watch-only by design.
#
#   git tag v0.1.0 && git push origin v0.1.0

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: gerfaut-mobile

      # The Rust crate depends on the sibling gerfaut-core checkout.
      - uses: actions/checkout@v4
        with:
          repository: gerfaut-wallet/gerfaut-core
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          path: gerfaut-core

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: gerfaut-mobile/rust

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build APK
        working-directory: gerfaut-mobile
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk \
            "gerfaut-${GITHUB_REF_NAME}-android.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: gerfaut-android-apk
          path: gerfaut-mobile/gerfaut-*-android.apk

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: gerfaut-mobile
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Gerfaut $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            "gerfaut-${GITHUB_REF_NAME}-android.apk"
