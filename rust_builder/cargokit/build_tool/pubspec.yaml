# This is copied from Cargokit (which is the official way to use it currently)
# Details: https://fzyzcjy.github.io/flutter_rust_bridge/manual/integrate/builtin

name: build_tool
description: Cargokit build_tool. Facilitates the build of Rust crate during Flutter application build.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

# Add regular dependencies here.
dependencies:
  # these are pinned on purpose; the build_tool_runner that
  # run_build_tool.sh writes installs them, and everything they depend
  # on, from build_tool_runner.lock, which has to agree with them.
  logging: 1.2.0
  path: 1.8.0
  version: 3.0.0
  collection: 1.18.0
  yaml: 3.1.2
  source_span: 1.10.0
  args: 2.4.2
  toml: 0.14.0

dev_dependencies:
  lints: ^2.1.0
  test: ^1.24.0
