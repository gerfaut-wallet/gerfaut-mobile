[package]
name = "rust_lib_gerfaut"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
# The built-in Tor client: a phone rarely runs a Tor daemon, and Orbot
# is a second app to install.
gerfaut-core = { path = "../../gerfaut-core", features = ["embedded-tor"] }
# To say how much of what the crates log reaches logcat: nothing in a
# release build. The version flutter_rust_bridge already pulls in, so
# nothing new is compiled.
log = "0.4"
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Cargo only honours [patch] in the root manifest: the same pin as in
# gerfaut-core, see the note there.
[patch.crates-io]
saturating-time = { git = "https://github.com/gerfaut-wallet/saturating-time", rev = "7bef6ba00f3adaa6aff7e68966614c9d55bb60ec" }

[dev-dependencies]
# To build a hostile QR frame in a test; the version the core already
# pulls in, so nothing new is fetched.
tokio = { version = "1", features = ["macros", "rt"] }
ur = "0.5"
