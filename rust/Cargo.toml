[package]
name = "rust_lib_gerfaut"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
# The built-in Tor client: a phone rarely runs a Tor daemon, and Orbot
# is a second app to install.
gerfaut-core = { path = "../../gerfaut-core", features = ["embedded-tor"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["sync"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
